<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master's of Education Degrees | Moreland's E-Portfolio</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="med" data-root="../">

  <!-- Shared Navigation Bar (injected by js/site.js) -->
  <div id="site-nav"></div>
  <noscript>
    <div class="noscript-banner">
      Navigation requires JavaScript. <a href="../index.html">Return to Home</a>.
    </div>
  </noscript>

  <!-- Page Header Banner -->
  <section class="site-banner" aria-label="Page header section">
    <h1 class="site-banner-title">Master's of Education Degrees</h1>

  <!-- Featured Presentation Band (Self-Hosted PDF.js Viewer — preserves clickable links) -->
  <section class="featured-media-band" aria-label="Master's of Education Degrees presentation">
    <!--
      SETUP:
      1. Place your exported PDF in: files/med-slides.pdf
      2. Download the prebuilt PDF.js release (pdfjs-*-dist.zip) and unzip its
         build/ and web/ folders into: pdfjs/
         (so pdfjs/web/viewer.html exists).
      Note: ?file=../../files/med-slides.pdf is resolved relative to pdfjs/web/viewer.html.
    -->
    <div class="pdf-viewer-frame">
      <iframe
        src="../pdfjs/web/viewer.html?file=../../files/med-slides.pdf#zoom=page-fit"
        title="Master's of Education Degrees presentation"
        class="pdf-viewer-iframe"
        allowfullscreen
        loading="lazy">
      </iframe>
    </div>
    <div class="pdf-viewer-actions">
      <a href="../files/med-slides.pdf" target="_blank" rel="noopener" class="btn-outline-light">
        Open / Download PDF
      </a>
    </div>
  </section>

  <!-- Page Content: Edit your content for this page below -->
  <main class="page-main">
    <article class="portfolio-page">
      <p>Add your M.Ed. overview content here.</p>
    </article>
  </main>
